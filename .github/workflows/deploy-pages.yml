name: Build résumé and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile résumé from LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            resume-frontier-arch.tex
            resume-frontier-full.tex
            resume-general-arch.tex
            resume-general-full.tex
          os: debian
          extra_system_packages: fonts-noto-cjk
          latexmk_use_xelatex: true

      - name: Assemble static site
        run: |
          mkdir -p _site/zh
          cp index.html styles.css .nojekyll _site/
          cp resume-frontier-arch.pdf resume-frontier-full.pdf resume-general-arch.pdf resume-general-full.pdf _site/
          cp zh/index.html _site/zh/
          test -s _site/resume-frontier-arch.pdf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
